name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Build Docker image
        run: docker build -t docker-test:${{ github.sha }} .

      - name: Test Docker container
        run: |
          docker run -d -p 8080:80 --name test-app docker-test:${{ github.sha }}
          sleep 3
          curl -f http://localhost:8080
          docker stop test-app
